listen: ":25565"
handshakeTimeout: "5s"
backendDialTimeout: "5s"
metrics:
  enabled: true
  listen: ":9090"
  path: "/metrics"
voiceChat:
  enabled: true
  listen: ":24454"
  registration:
    listen: ":9091"
    registrationTTL: "30s"
    requestTimeout: "5s"
    maxRegistrations: 4096
  session:
    idleTimeout: "30s"
    backendDialTimeout: "5s"
    maxSessions: 4096
    maxPacketSize: 65535
  backends:
    hub:
      udp: "hub:24454"
      tokenEnv: "VOICECHAT_TOKEN_HUB"
    survival:
      udp: "survival:24454"
      tokenEnv: "VOICECHAT_TOKEN_SURVIVAL"
fallback:
  enabled: true
  login:
    enabled: false
    respondOnRouteDenied: true
    message: "Server unavailable. Please try again later."
  status:
    enabled: true
    respondOnRouteDenied: true
    motd: "Server unavailable"
    protocolName: "mc-gateway"
    protocolVersion: 767
    maxPlayers: 0
    onlinePlayers: 0
unknownHostPolicy: "deny"
routes:
  # Connect to hub.mc-router.test through mc-router's single public TCP entry
  # point to reach the Hub backend.
  - serverAddress: "hub.mc-router.test"
    backend: "hub:25565"
  # Connect to survival.mc-router.test through the same TCP entry point to reach
  # the Fabric Survival backend. Hub Transfer tests should target this hostname.
  - serverAddress: "survival.mc-router.test"
    backend: "survival:25565"
