listen: ":25565"
handshakeTimeout: "5s"
backendDialTimeout: "5s"
metrics:
  enabled: true
  listen: ":9090"
  path: "/metrics"
bedrock:
  enabled: true
  listen: ":19132"
  defaultBackend: "mc-hub.mc-hub.svc.cluster.local:19132"
  sessionTimeout: "30s"
# Fallback responses are disabled by default. This example opts in to a
# generic status response for denied status pings.
fallback:
  enabled: true
  login:
    # Enable only when a generic login disconnect for denied hosts is acceptable.
    enabled: false
    respondOnRouteDenied: true
    message: "Server unavailable. Please try again later."
  status:
    enabled: true
    respondOnRouteDenied: true
    # Backend failure fallback can reveal that a configured route exists.
    # Enable it only when a generic unavailable response is acceptable.
    respondOnBackendFailure: false
    motd: "Server unavailable"
    protocolName: "mc-gateway"
    protocolVersion: 767
    maxPlayers: 0
    onlinePlayers: 0
unknownHostPolicy: "deny"
defaultRoute:
  backend: "mc-hub.mc-hub.svc.cluster.local:25565"
  mode: "allow"
routes:
  - serverAddress: "hub.example.com"
    backend: "mc-hub.mc-hub.svc.cluster.local:25565"
  - serverAddress: "smp.example.com"
    backend: "alec-smp.alec-smp.svc.cluster.local:25565"
  - serverAddress: "lobby.example.com"
    backend: "alec-smp-lobby.alec-smp-lobby.svc.cluster.local:25565"
