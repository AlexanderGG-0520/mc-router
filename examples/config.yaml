listen: ":25565"
handshakeTimeout: "5s"
backendDialTimeout: "5s"
# Disabled when both lists are empty. If allow has entries, only matching
# source IP addresses or CIDRs can connect and allow takes precedence over deny.
clientPolicy:
  allow: []
  deny: []
# Disabled by default. A separate token bucket is maintained per source IP.
clientRateLimit:
  enabled: false
  connectionsPerSecond: 1
  burst: 3
  idleTimeout: "10m"
  maxEntries: 4096
# Disabled by default. Watches the config file, including Kubernetes ConfigMap updates.
configReload:
  watch: false
  debounce: "1s"
metrics:
  enabled: true
  listen: ":9090"
  path: "/metrics"
bedrock:
  enabled: true
  mode: "host-proxy"
  listen: ":19132"
  defaultBackend: "mc-hub.mc-hub.svc.cluster.local:19132"
  sessionTimeout: "30s"
  # host-proxy mode reads the Bedrock login ServerAddress and matches it
  # against these route hosts. Unknown hosts fall back to defaultBackend.
  routes:
    - name: hub
      hosts:
        - "play.example.com"
        - "hub.play.example.com"
      backend: "mc-hub.mc-hub.svc.cluster.local:19132"
    - name: creative
      hosts:
        - "creative.play.example.com"
      backend: "mc-creative.mc-creative.svc.cluster.local:19132"
    - name: survival
      hosts:
        - "survival.play.example.com"
      backend: "mc-survival.mc-survival.svc.cluster.local:19132"
# Fallback responses are disabled by default. This example opts in to a
# generic status response for denied status pings.
fallback:
  enabled: true
  login:
    # Enable only when a generic login disconnect for denied hosts is acceptable.
    enabled: false
    respondOnRouteDenied: true
    message: "Server unavailable. Please try again later."
  status:
    enabled: true
    respondOnRouteDenied: true
    # Backend failure fallback can reveal that a configured route exists.
    # Enable it only when a generic unavailable response is acceptable.
    respondOnBackendFailure: false
    motd: "Server unavailable"
    protocolName: "mc-gateway"
    protocolVersion: 767
    maxPlayers: 0
    onlinePlayers: 0
unknownHostPolicy: "deny"
defaultRoute:
  backend: "mc-hub.mc-hub.svc.cluster.local:25565"
  mode: "allow"
routes:
  - serverAddress: "hub.example.com"
    backend: "mc-hub.mc-hub.svc.cluster.local:25565"
    # Status pings normally use this backend, while Login and Transfer use backend.
    # statusOverride below takes precedence when it is configured.
    statusBackend: "alec-smp.alec-smp.svc.cluster.local:25565"
    # When present, this static response is returned for Java status pings
    # without contacting the backend. Login and Transfer still use backend.
    statusOverride:
      motd: "Alec SMP 2"
      protocolName: "Alec SMP 2"
      protocolVersion: 767
      maxPlayers: 100
      onlinePlayers: 0
  - serverAddress: "smp.example.com"
    backend: "alec-smp.alec-smp.svc.cluster.local:25565"
  - serverAddress: "lobby.example.com"
    backend: "alec-smp-lobby.alec-smp-lobby.svc.cluster.local:25565"
