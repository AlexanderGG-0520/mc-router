name: mc-router-voicechat

services:
  volume-permissions:
    image: alpine:3.22
    user: "0:0"
    command:
      - sh
      - -ec
      - |
        for file in \
          /sources/simple-voice-chat-paper.jar \
          /sources/simple-voice-chat-fabric.jar \
          /sources/fabric-api.jar \
          /sources/mc-router-voicechat-companion-paper.jar \
          /sources/mc-router-voicechat-companion-fabric.jar \
          /sources/hub-voicechat-server.properties \
          /sources/survival-voicechat-server.properties
        do
          test -f "$$file" || {
            echo "Required source file is missing or is not a regular file: $$file" >&2
            exit 1
          }
          done

        mkdir -p \
          /hub-data/plugins/voicechat \
          /survival-data/mods \
          /survival-data/config/voicechat

        cp /sources/simple-voice-chat-paper.jar \
          /hub-data/plugins/simple-voice-chat.jar

        cp /sources/mc-router-voicechat-companion-paper.jar \
          /hub-data/plugins/mc-router-voicechat-companion.jar

        cp /sources/hub-voicechat-server.properties \
          /hub-data/plugins/voicechat/voicechat-server.properties

        cp /sources/fabric-api.jar \
          /survival-data/mods/fabric-api.jar

        cp /sources/simple-voice-chat-fabric.jar \
          /survival-data/mods/simple-voice-chat.jar

        cp /sources/mc-router-voicechat-companion-fabric.jar \
          /survival-data/mods/mc-router-voicechat-companion.jar

        cp /sources/survival-voicechat-server.properties \
          /survival-data/config/voicechat/voicechat-server.properties

        chown -R 10001:10001 /hub-data /survival-data
        chmod -R u+rwX,go-rwx /hub-data /survival-data
    volumes:
      - type: volume
        source: hub-data
        target: /hub-data

      - type: volume
        source: survival-data
        target: /survival-data

      - type: bind
        source: ./local-jars/simple-voice-chat-paper.jar
        target: /sources/simple-voice-chat-paper.jar
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./local-jars/simple-voice-chat-fabric.jar
        target: /sources/simple-voice-chat-fabric.jar
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./local-jars/fabric-api.jar
        target: /sources/fabric-api.jar
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./companion/paper/build/libs/mc-router-voicechat-companion-paper-0.2.0.jar
        target: /sources/mc-router-voicechat-companion-paper.jar
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./companion/fabric/build/libs/mc-router-voicechat-companion-fabric-0.2.0.jar
        target: /sources/mc-router-voicechat-companion-fabric.jar
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./examples/voicechat-local/hub/plugins/voicechat/voicechat-server.properties
        target: /sources/hub-voicechat-server.properties
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./examples/voicechat-local/backend/plugins/voicechat/voicechat-server.properties
        target: /sources/survival-voicechat-server.properties
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
  mc-router:
    container_name: mc-router-voicechat-router
    image: alecjp02/mc-router:v0.2.0
    command:
      - -config
      - /etc/mc-gateway/voicechat-local.yaml
      - -log-level
      - debug
    depends_on:
      hub:
        condition: service_healthy
      survival:
        condition: service_healthy
    environment:
      VOICECHAT_TOKEN_HUB: "${VOICECHAT_TOKEN_HUB:-change-me-hub-token}"
      VOICECHAT_TOKEN_SURVIVAL: "${VOICECHAT_TOKEN_SURVIVAL:-change-me-survival-token}"
    ports:
      - "25565:25565/tcp"
      - "127.0.0.1:9090:9090/tcp"
      - "24454:24454/udp"
    expose:
      - "9091/tcp"
    volumes:
      - ./examples/voicechat-local.yaml:/etc/mc-gateway/voicechat-local.yaml:ro
    networks:
      voicechat:
        aliases:
          - mc-router.local
          - hub.mc-router.test
          - survival.mc-router.test

  hub:
    container_name: mc-router-voicechat-hub
    image: "${MINECRAFT_SERVER_IMAGE_REPOSITORY:-alecjp02/minecraft-server}:runtime-jre21"
    command:
      - /entrypoint.sh
    environment:
      EULA: "true"
      TYPE: "paper"
      VERSION: "1.21.8"

      ONLINE_MODE: "false"
      ENABLE_COMMAND_BLOCK: "true"
      ACCEPTS_TRANSFERS: "true"
      MOTD: "mc-router voicechat hub"

      MAX_MEMORY: "1G"
      JVM_XMS: "512M"
      JVM_XMX: "1G"

      ENABLE_RCON: "true"
      RCON_PASSWORD: "${MC_ROUTER_VOICECHAT_RCON_PASSWORD:-mc-router-voicechat-local}"
      RCON_PORT: "25575"

      MC_ROUTER_VOICECHAT_REGISTRATION_URL: "http://mc-router:9091"
      MC_ROUTER_VOICECHAT_BACKEND_ID: "hub"
      MC_ROUTER_VOICECHAT_TOKEN: "${VOICECHAT_TOKEN_HUB:-change-me-hub-token}"
      MC_ROUTER_VOICECHAT_PUBLIC_HOST: "127.0.0.1:24454"
    ports:
      - "127.0.0.1:25566:25565/tcp"
      - "127.0.0.1:25575:25575/tcp"
    volumes:
      - hub-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /data/.ready
      start_period: 2m
      interval: 10s
      timeout: 3s
      retries: 30
    networks:
      voicechat:
        aliases:
          - hub
    depends_on:
      volume-permissions:
        condition: service_completed_successfully

  survival:
    container_name: mc-router-voicechat-survival
    image: "${MINECRAFT_SERVER_IMAGE_REPOSITORY:-alecjp02/minecraft-server}:runtime-jre25"
    command:
      - /entrypoint.sh
    environment:
      EULA: "true"
      TYPE: "fabric"
      VERSION: "26.1.2"

      ONLINE_MODE: "false"
      ACCEPTS_TRANSFERS: "true"
      MOTD: "mc-router voicechat survival"

      MAX_MEMORY: "1G"
      JVM_XMS: "512M"
      JVM_XMX: "1G"

      ENABLE_RCON: "true"
      RCON_PASSWORD: "${MC_ROUTER_VOICECHAT_RCON_PASSWORD:-mc-router-voicechat-local}"
      RCON_PORT: "25576"

      MC_ROUTER_VOICECHAT_REGISTRATION_URL: "http://mc-router:9091"
      MC_ROUTER_VOICECHAT_BACKEND_ID: "survival"
      MC_ROUTER_VOICECHAT_TOKEN: "${VOICECHAT_TOKEN_SURVIVAL:-change-me-survival-token}"
      MC_ROUTER_VOICECHAT_PUBLIC_HOST: "127.0.0.1:24454"
    ports:
      - "127.0.0.1:25567:25565/tcp"
      - "127.0.0.1:25576:25576/tcp"
    volumes:
      - survival-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /data/.ready
      start_period: 2m
      interval: 10s
      timeout: 3s
      retries: 30
    networks:
      voicechat:
        aliases:
          - backend
          - survival
    depends_on:
      volume-permissions:
        condition: service_completed_successfully

  hub-nettools:
    container_name: mc-router-voicechat-hub-nettools
    image: nicolaka/netshoot:v0.13
    profiles:
      - nettools
    network_mode: "service:hub"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command:
      - sleep
      - infinity
    depends_on:
      hub:
        condition: service_started

  survival-nettools:
    container_name: mc-router-voicechat-survival-nettools
    image: nicolaka/netshoot:v0.13
    profiles:
      - nettools
    network_mode: "service:survival"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command:
      - sleep
      - infinity
    depends_on:
      survival:
        condition: service_started

networks:
  voicechat:
    name: mc-router-voicechat-net

volumes:
  hub-data:
    name: mc-router-voicechat-hub-data
  survival-data:
    name: mc-router-voicechat-survival-data
