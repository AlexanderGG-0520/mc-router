name: docker publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dockerhub_image:
        description: "Optional Docker Hub image, for example namespace/mc-router"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/alexandergg-0520/mc-router
  DOCKERHUB_IMAGE: ${{ inputs.dockerhub_image || vars.DOCKERHUB_IMAGE || '' }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_CREDS_AVAILABLE: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_IMAGE != '' && env.DOCKERHUB_CREDS_AVAILABLE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image list
        id: images
        shell: bash
        run: |
          images="${GHCR_IMAGE}"
          if [[ -n "${DOCKERHUB_IMAGE}" && "${DOCKERHUB_CREDS_AVAILABLE}" == "true" ]]; then
            images="${images}"$'\n'"${DOCKERHUB_IMAGE}"
          fi

          {
            echo "images<<EOF"
            printf '%s\n' "${images}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.images }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=mc-router
            org.opencontainers.image.description=Lightweight Minecraft server router/proxy helper
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
