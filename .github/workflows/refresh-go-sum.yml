name: refresh-go-sum

on:
  push:
    branches:
      - fix/bedrock-host-proxy-regression

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/bedrock-host-proxy-regression

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Refresh module metadata
        run: go mod tidy

      - name: Verify Bedrock proxy tests
        run: go test ./internal/bedrockproxy

      - name: Commit module metadata
        run: |
          if git diff --quiet -- go.mod go.sum; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "test: refresh Go module metadata"
          git push origin HEAD:fix/bedrock-host-proxy-regression
