name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: gofmt check
        run: |
          test -z "$(gofmt -l .)"

      - name: go test
        run: go test ./...

      - name: Bedrock host proxy regression
        run: go test ./internal/bedrockproxy -run 'TestProxy(RoutesConnectionByRequestedHost|FallsBackToDefaultBackendForUnknownHost|CloseStopsActiveConnection)$' -count=20

      - name: Bedrock host proxy race regression
        run: go test -race ./internal/bedrockproxy -run 'TestProxy(RoutesConnectionByRequestedHost|FallsBackToDefaultBackendForUnknownHost|CloseStopsActiveConnection)$' -count=5

      - name: go test race
        run: go test -race ./...

      - name: go vet
        run: go vet ./...

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.1"
          cache-provider: basic

      - name: Voice chat companion build
        run: gradle -p companion :core:test :fabric:jar :paper:jar

      - name: Voice chat Compose config
        run: docker compose -f compose.voicechat.yaml config

      - name: Docker build smoke
        run: docker build -t mc-gateway:ci .
